<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>健身動作評分</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 第一頁：選擇動作 -->
  <section id="page-select" class="page">
    <header class="select-header">
      <h1>健身動作評分</h1>
    </header>
    <div class="cards">
      <button class="card" data-exercise="squat">
        <span class="card-media">
          <img src="img/squat.svg" alt="深蹲示意圖">
          <span class="chip">手機直放</span>
        </span>
        <span class="card-title">深蹲</span>
        <span class="card-desc">判斷膝角、軀幹前傾</span>
      </button>
      <button class="card" data-exercise="pushup">
        <span class="card-media">
          <img src="img/pushup.svg" alt="伏地挺身示意圖">
          <span class="chip">手機橫放</span>
        </span>
        <span class="card-title">伏地挺身</span>
        <span class="card-desc">判斷肘角、身體是否成一直線</span>
      </button>
      <button class="card" data-exercise="lunge">
        <span class="card-media">
          <img src="img/lunge.svg" alt="弓箭步示意圖">
          <span class="chip">手機直放</span>
        </span>
        <span class="card-title">弓箭步</span>
        <span class="card-desc">判斷前膝、後膝角度與上半身是否挺直</span>
      </button>
      <button class="card" data-exercise="plank">
        <span class="card-media">
          <img src="img/plank.svg" alt="棒式示意圖">
          <span class="chip">手機橫放 · 計時</span>
        </span>
        <span class="card-title">棒式</span>
        <span class="card-desc">判斷肩、髖、踝是否成一直線，計算維持秒數</span>
      </button>
    </div>
    <p id="model-status" class="status"></p>
  </section>

  <!-- 第二頁：錄影與計次 -->
  <section id="page-workout" class="page" hidden>
    <header class="bar">
      <button id="back" class="icon-btn" aria-label="返回">←</button>
      <h2 id="workout-title">深蹲</h2>
      <button id="flip" class="icon-btn" aria-label="切換前後鏡頭">⟲</button>
    </header>

    <main id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>

      <div id="hud">
        <div class="count"><span id="count">0</span><small id="count-unit">下</small></div>
        <div class="metrics">
          <div><span id="key-label">膝角</span><b id="key-angle">–</b></div>
          <div id="extra"></div>
          <div><span id="last-label">上一下</span><b id="last-score">–</b></div>
        </div>
        <div id="hint" class="hint"></div>
        <div id="rec" class="rec" hidden></div>
        <div class="meta"><span id="side"></span> <span id="fps"></span></div>
      </div>

      <div id="center" class="center" hidden></div>
      <div id="summary" class="summary" hidden></div>

      <div id="camera-panel" class="panel">
        <ul id="tips" class="tips"></ul>
        <button id="open-camera" class="primary">開啟鏡頭</button>
        <label class="secondary">
          或用影片測試
          <input id="file" type="file" accept="video/*" hidden>
        </label>
        <p id="status" class="status"></p>
      </div>
    </main>

    <footer class="bar">
      <label class="toggle"><input id="voice" type="checkbox" checked> 語音</label>
      <button id="go" class="primary" disabled>結束</button>
      <button id="record" class="small-btn" disabled>錄標準動作</button>
    </footer>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
